services:
  app:
    container_name: bolsillo-dental-app
    image: bolsillo-dental-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - path: .env
        required: false
    volumes:
      - app_storage:/var/www/storage
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bolsillo-dental-network

  queue:
    container_name: bolsillo-dental-queue
    image: bolsillo-dental-app:latest
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
    env_file:
      - path: .env
        required: false
    volumes:
      - app_storage:/var/www/storage
    restart: always
    stop_signal: SIGTERM
    stop_grace_period: 100s
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - bolsillo-dental-network

  bolsillo-nginx:
    container_name: bolsillo-dental-nginx
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx-production
    restart: always
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - app_storage:/var/www/storage:ro
    networks:
      - bolsillo-dental-network

  db:
    container_name: bolsillo-dental-db
    image: postgres:14.3
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bolsillo_dental}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-bolsillo_dental}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bolsillo-dental-network

networks:
  bolsillo-dental-network:

volumes:
  app_storage:
  postgres_data:
