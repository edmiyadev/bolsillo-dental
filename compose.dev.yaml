services:
  app:
    container_name: bolsillo-dental-app
    hostname: bolsillo-dental-app
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      HOME: /tmp
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-bolsillo_dental}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      SESSION_DRIVER: file
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bolsillo-dental-network

  nginx:
    image: nginx:alpine
    container_name: bolsillo-dental-nginx
    hostname: bolsillo-dental-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - bolsillo-dental-network

  db:
    container_name: bolsillo-dental-db
    hostname: bolsillo-dental-db
    image: postgres:14.3
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_DATABASE:-bolsillo_dental}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-bolsillo_dental}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bolsillo-dental-network

networks:
  bolsillo-dental-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
